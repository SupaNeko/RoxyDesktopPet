[package]
name = "chatpet"
version = "0.1.0"
description = "A local-first Windows AI desktop companion"
edition = "2021"
rust-version = "1.80"

[lib]
name = "chatpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "io-util"] }
reqwest = { version = "0.12", features = ["json"] }
rodio = "0.20"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
thiserror = "2"
cpal = "0.16"
voice_activity_detector = "0.2.1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
url = "2"
rand = "0.9"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3"
